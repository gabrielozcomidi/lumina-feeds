name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/lumina_feeds/manifest.json'))['version'])")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version check OK: $TAG_VERSION"

      - name: Create release archive
        run: |
          cd custom_components
          zip -r ../lumina_feeds.zip lumina_feeds

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: lumina_feeds.zip
          generate_release_notes: true
